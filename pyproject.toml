[project]
name = "eyepy"
version = "0.20.1"
description = "A Python package to read, analyze, and visualize OCT and fundus data from various sources."
authors = [{ name = "Olivier Morelle", email = "oli4morelle@gmail.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
keywords = [
    "ophthalmology",
    "oct",
    "visualization",
    "spectralis",
]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22.0",
    "scikit-image>=0.22.0",
    "construct>=2.10.68",
    "construct-typing>=0.8.1,<0.9",
    "imageio>=2.25.1,<3",
]

[project.optional-dependencies]
itk = ["itk>=5.3.0,<6"]
pandas = ["pandas>=1.5.3"]
fda = ["oct-converter>=0.7.0,<0.8"]
plot = ["matplotlib>=3.9.4"]      # optional for WASM compatibility
quant = ["scipy>=1.10.0"]
tiff = ["imagecodecs>=2025.3.30"]
all = [
    "imagecodecs>=2025.3.30",     # Tiff reading
    "scipy>=1.10.0",              # Quantification
    "matplotlib>=3.9.4",          # Plotting
    "itk>=5.3.0,<6",              # RETOUCH dataset import
    "pandas>=1.5.3",              # E2E metadata as DataFrame
    "oct-converter>=0.7.0,<0.8",  # Topcon FDA file reading
]

[project.urls]
Documentation = "https://medvisbonn.github.io/eyepy/"
Issues = "https://github.com/MedVisBonn/eyepy/issues"
Repository = "https://github.com/MedVisBonn/eyepy"


[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<8",
]
test-all = [
    {include-group = "test"},
    "imagecodecs>=2025.3.30",
    "scipy>=1.10.0",
    "matplotlib>=3.9.4",
    "itk>=5.3.0,<6",
    "pandas>=1.5.3",
    "oct-converter>=0.7.0,<0.8",
]
doc = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.14,<10",
    "mkdocstrings>=0.29.1,<1",
    "mkdocs-gen-files>=0.6.1,<0.7",
    "mkdocs-literate-nav>=0.6.3,<0.7",
    "mkdocs-section-index>=0.3.12,<0.4",
    "pymdown-extensions>=11.0.1,<12",
    "mkdocs-macros-plugin>=1.3.7,<2",
    "mkdocstrings-python>=1.16.12,<2",
    "tabulate>=0.10.0,<0.11",
    "pygifsicle>=1.0.7,<2",
]
format = [
    "yapf>=0.43.0,<0.44",
    "pre-commit>=4.0.0,<5",
    "commitizen>=4.0.0,<5",
]
notebook = [
    "jupyter>=1.0.0,<2",
]
dev = [
    {include-group = "test-all"},
    {include-group = "doc"},
    {include-group = "format"},
    {include-group = "notebook"},
    "nox>=2026.8.17",
]

[tool.hatch.build.targets.sdist]
include = ["src/eyepy"]

[tool.hatch.build.targets.wheel]
include = ["src/eyepy"]

[tool.hatch.build.targets.wheel.sources]
"src/eyepy" = "eyepy"


[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
version_variables = [
    "src/eyepy/__init__.py:__version__",
    "CITATION.cff:version",
]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
upload_to_vsc_release = true
# Use uv to build distributions (includes hatchling backend)
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.docformatter]
check = false
recursive = true
in-place = true
syntax = "google"
wrap-summaries = 82
blank = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
source = ["eyepy"]

[tool.coverage.report]
fail_under = 55
skip_empty = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
